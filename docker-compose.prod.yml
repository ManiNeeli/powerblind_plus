version: "3.9"

# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    restart: always
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:   { cpus: "0.5", memory: "128M" }
        reservations: { memory: "64M" }

  api:
    restart: always
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits:   { cpus: "1.0", memory: "512M" }
        reservations: { memory: "256M" }

  ml:
    restart: always
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits:   { cpus: "2.0", memory: "2G" }   # XGBoost + SHAP can use ~1.5GB
        reservations: { memory: "512M" }
